services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nerm
      POSTGRES_PASSWORD: nerm
      POSTGRES_DB: nerm
    ports:
      - '5432:5432'
    volumes:
      - nerm-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nerm']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local OIDC provider standing in for Entra ID / Okta / ISC.
  # Realm and client are imported from ./docker/keycloak-realm.json.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - '8080:8080'
    volumes:
      - ./docker/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - nerm-minio:/data

volumes:
  nerm-pg:
  nerm-minio:
